name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Parity with the recorded command line output
        run: pnpm test:parity
      - run: pnpm build
      # The app consumes the package through its built exports, so these follow the build above.
      - run: pnpm --filter obd-read-app lint
      - run: pnpm --filter obd-read-app typecheck
      - run: pnpm --filter obd-read-app test
      - run: pnpm --filter obd-read-app build

  app-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter obd-read-app exec playwright install --with-deps chromium
      - run: pnpm --filter obd-read-app e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-screenshots
          path: app/screenshots/
