name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Creating a release needs to write the tag and the release; nothing else.
permissions:
  contents: write

# One run at a time, so two pushes cannot both decide the tag is missing; a queued run is never cancelled.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      # The script reads only package.json and the tag names on standard input, so no install is needed.
      - id: decide
        name: Decide whether the version still needs a release
        run: git ls-remote --tags --refs origin | sed 's|.*refs/tags/||' | node scripts/release-needed.ts >> "$GITHUB_OUTPUT"
      - name: Create the tag and the release
        if: steps.decide.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.decide.outputs.tag }}
        run: gh release create "$TAG" --target "$GITHUB_SHA" --generate-notes --title "$TAG"
