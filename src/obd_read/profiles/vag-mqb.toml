# Volkswagen Group MQB platform.
#
# The addresses are the ISO-TP request and response pairs a community wiki lists from sniffing
# MQB cars, recorded in docs/vehicles/vag-group.md. They come from captures, not from a
# Volkswagen document, and other platforms (MLB, PQ and others) differ. Treat every row as
# unconfirmed on a given car until `obd-read probe` shows the unit answering. Newer cars may
# block some modules entirely through the gateway.
#
# The bus is the OBD-II socket's ISO 15765-4 CAN on pins 6 and 14, 11-bit identifiers at
# 500 kbit/s (docs/vehicles/generic-standards.md). The wiki names no diagnostic session, so the
# default session, which every UDS unit must accept, is the one opened before reading.

name = "vag-mqb"
description = "Volkswagen Group MQB platform, UDS over ISO-TP"
status = "unconfirmed"

[bus]
id_bits = 11
bitrate = 500000

[diagnostics]
protocol = "uds"
session = 0x01

[units.engine]
description = "Engine control unit (engine 1)"
request = 0x7E0
response = 0x7E8
source = "Mr-fix wiki 'CAN-BUS sniffing' (https://wiki.mr-fix.info/index.php?title=CAN-BUS_sniffing), as recorded in docs/vehicles/vag-group.md"

[units.engine-2]
description = "Second engine control unit (engine 2)"
request = 0x7E2
response = 0x7EA
source = "Mr-fix wiki 'CAN-BUS sniffing' (https://wiki.mr-fix.info/index.php?title=CAN-BUS_sniffing), as recorded in docs/vehicles/vag-group.md"

