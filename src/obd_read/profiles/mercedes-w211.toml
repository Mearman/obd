# Mercedes-Benz E-Class, chassis 211 (W211 saloon, S211 estate).
#
# The diagnostic socket's CAN pair (pins 6 and 14) reaches the central gateway at
# 500 kbit/s. Control units answer KWP2000 requests carried over ISO 15765-2.
#
# The address table is transcribed from an open E55 AMG project that states no model
# year. Treat every row as unconfirmed on a given car until `obd-read probe` shows the
# unit answering.

name = "mercedes-w211"
description = "Mercedes-Benz E-Class, chassis 211"
status = "unconfirmed"

[bus]
id_bits = 11
bitrate = 500000

[diagnostics]
protocol = "kwp2000"
# 0x92 is the session W211 instrument-cluster code opens before reading data.
session = 0x92

[units.engine]
description = "Engine control unit"
request = 0x7E0
response = 0x7E8
source = "can_spec_canc.txt in https://github.com/rnd-ash/mb-w211-pc"

[units.gearbox]
description = "Transmission control unit"
request = 0x7E1
response = 0x7E9
source = "can_spec_canc.txt in https://github.com/rnd-ash/mb-w211-pc"

[units.esp]
description = "Electronic stability programme"
request = 0x784
response = 0x785
source = "can_spec_canc.txt in https://github.com/rnd-ash/mb-w211-pc"

[units.ewm]
description = "Electronic selector lever module (EWM)"
request = 0x788
response = 0x789
source = "can_spec_canc.txt in https://github.com/rnd-ash/mb-w211-pc"

[units.fscm]
description = "FSCM, as named in the source"
request = 0x778
response = 0x779
source = "can_spec_canc.txt in https://github.com/rnd-ash/mb-w211-pc"

[units.cas]
