[project]
name = "obd-read"
version = "0.1.0"
description = "Read vehicle diagnostics through ELM327-style adapters"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["bleak>=0.22", "pyserial>=3.5"]

[project.scripts]
obd-read = "obd_read.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/obd_read"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "mypy>=1.11", "ruff>=0.6", "types-pyserial>=3.5"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# Prose in comments and docstrings is one line per paragraph, never hard-wrapped;
# the formatter keeps code within line-length.
ignore = ["E501"]
